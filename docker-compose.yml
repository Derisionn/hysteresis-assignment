version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: farmlokal_postgres
    environment:
      POSTGRES_USER: farmlokal
      POSTGRES_PASSWORD: farmlokal123
      POSTGRES_DB: farmlokal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmlokal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: farmlokal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmlokal_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://farmlokal:farmlokal123@postgres:5432/farmlokal_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Mock External API
  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: farmlokal_mock_api
    ports:
      - "8001:8001"
    command: uvicorn mock_services.external_api:app --host 0.0.0.0 --port 8001

volumes:
  postgres_data:
  redis_data:
